# ============================================================================
# config/universe.yaml — universe (D14), ingestion scope, snapshot scope (D22)
# ----------------------------------------------------------------------------
# Everything that answers "what do we pull data for, and how much of it".
#
# Values tagged [OPEN] have a row in docs/open-parameters.md.
# ============================================================================

version: 1

# ── Universe composition (D14) ──────────────────────────────────────────────
# S&P 500 + Nasdaq 100 => ~550 unique, liquidity-filtered, plus the watchlist,
# landing around ~500 names.
sources:
  sp500: true                  # D14
  nasdaq100: true              # D14
  watchlist_file: config/watchlist.txt   # D14 — merged in, exempt from filter
  # PREMIUM from 2026-10-21: both constituents endpoints pass, so this file is
  # no longer the normal path. KEPT ON PURPOSE as the fallback — a plan can
  # lapse and billing can 402 an endpoint overnight, and a stale universe beats
  # no universe. The builder logs a warning naming its AS_OF date whenever it
  # falls back, so using it is never silent. Keep the file maintained (D29).
  static_fallback_file: config/constituents_static.txt
  allow_static_fallback: true

# ── Liquidity filter (D14) ──────────────────────────────────────────────────
# "avg volume >1M and active options chain". Swings and options need to be able
# to get out at a reasonable price; illiquid names are where plans die.
liquidity:
  min_avg_volume: 1000000      # D14 — strictly greater than
  avg_volume_lookback_days: 20 # D14
  require_options: true        # D14 — abstains while has_options is NULL
  min_price: 5.00              # [OPEN] #18 — protects option strategies
  # The watchlist is an explicit human override: if you put it there, you want
  # it scored, filter or no filter.
  exempt_watchlist: true

# ── Universe maintenance ────────────────────────────────────────────────────
maintenance:
  # Symbols are deactivated, never deleted: ideas, fundamentals, events and
  # news all FK to tickers.symbol and a delete would cascade history away.
  deactivate_missing: true
  # Adjusted 3 -> 5 on Sep 1: a holiday-adjacent API hiccup can span 3 days.
  deactivate_after_absent_days: 5   # [OPEN] #19
  max_universe_size: 600            # [OPEN] #20 — a malformed constituents
                                    # response must fail the job, not ingest

# ── Option-chain snapshot scope (D22) ───────────────────────────────────────
# THE SACRED JOB (D7). ~10x less data than full chains while still supporting
# IV rank, skew, and expected move. The clock on this history starts the day the
# job starts running, so this filter should widen only deliberately — narrowing
# it later leaves a permanent hole in the series.
option_chains:
  strike_range_pct: 15         # D22 — strikes within +/-15% of spot
  monthly_expirations: 4       # D22 — the nearest 4 MONTHLY expirations
  # D22 means standard monthlies: Schwab's expirationType 'S' (third Friday).
  # NOT 'M', which is MONTH-END and a different series entirely.
  monthly_only: true
  include_calls: true
  include_puts: true           # both sides: skew needs puts
  min_open_interest: 0         # [OPEN] #21 — the one value expensive to get
                               # wrong in only one direction: it governs what
                               # gets STORED. Filter at read time instead.
  aggregate_iv: true           # D22 — per-ticker aggregate IV row
  iv_rank_lookback_days: 252   # [OPEN] #22 — one trading year
  iv_rank_min_history_days: 60 # [OPEN] #23 — below this, rank reports NULL

# ── Estimate snapshot scope (D7) ────────────────────────────────────────────
# THE OTHER SACRED JOB. Analyst estimates written as a dated snapshot so the
# day-over-day diff becomes estimate-revision momentum.
# LIVE from 2026-10-21: `analyst-estimates` passes the probe, so the job is
# recorded is_critical and its first snapshot was taken that day. THE REVISION
# CLOCK STARTED 2026-10-21 — there is no history before it and none for sale.
# The probe that sets `is_critical` stays, so a lapsed plan degrades rather
# than failing the day (D29).
estimates:
  period_types: [quarter, annual]
  quarters_ahead: 4            # [OPEN] #24 — raw material for revision momentum
  annuals_ahead: 2             # [OPEN] #25

# ── Fundamentals scope (D4/D29) ─────────────────────────────────────────────
# Reported financials and ratios for Pillar B. Point-in-fact records keyed by
# fiscal period, so re-pulling changes nothing unless a company restates.
# `ratios` and `key-metrics` are UNLOCKED from 2026-10-21, so the valuation
# columns populate. The degrade-on-402 path stays for a lapsed plan, and it now
# confirms a suspected gate against a known-good canary symbol first: a 402 can
# mean "this endpoint dislikes that symbol" (verified: BRK.B 402s, AAPL 200s),
# and acting on that would NULL these columns for every remaining symbol.
fundamentals:
  quarters_history: 12         # [OPEN] #26 — 3 years; Pillar B reads trend
  annuals_history: 5           # [OPEN] #27
  # Financials change four times a year. Re-pulling ~500 names daily costs
  # ~2,500 calls to rewrite identical rows, so a symbol is refreshed only when
  # its stored data is older than this, or when it has just reported.
  refresh_after_days: 7        # [OPEN] #28

# ── Events scope (D19 / Pillar C) ───────────────────────────────────────────
# The event radar. Forward window feeds "days to earnings" and the D19 ex-date
# rules; the backward window catches actuals landing on already-known dates.
events:
  forward_days: 90             # [OPEN] #29 — must exceed the longest recipe
                               # horizon (45d) and the expirations we snapshot
  # MUST cover a full quarter, and that is a hard dependency rather than a
  # preference. `post_earnings_drift` reads "days since the last earnings",
  # which requires that date to be STORED — and earnings are quarterly, so a
  # 7-day backward window held the last report for only 7 of every ~92 days.
  # Live on 2026-10-21 the events table held ZERO past earnings and the recipe
  # was structurally dead: 120 of 120 symbols refused with "no past earnings
  # date on record". A cross-config invariant now requires this to exceed
  # `mapping.catalyst.drift_window_days` — re-anchored by D49, which retired
  # `post_earnings_drift.max_days_since_earnings`; Pillar C is now the consumer
  # that reads a past earnings date back.
  backward_days: 100           # [OPEN] #30

# ── News scope (D5) ─────────────────────────────────────────────────────────
news:
  lookback_days: 7             # rolling 7-day window

# ── Sector composites (D33: relative strength) ──────────────────────────────
# The sector index relative strength is measured against. Equal-weighted, with
# PER-DATE membership: each date averages the members that have data on it.
#
# The floor stops the early part of a window becoming a one-stock index. On a
# date where only 3 of 40 members had listed, the "sector" would be those
# three — and relative strength against three stocks is not relative strength
# against a sector.
sector:
  min_member_fraction: 0.8     # [OPEN] #67
  # Below this many members with any history, a sector has no index at all:
  # with two members, one of them IS the thing being measured.
  min_members: 3

# ── SEC EDGAR (D39: insider clusters) ───────────────────────────────────────
# The SEC asks for a descriptive User-Agent with a contact address and no more
# than ~10 requests/second. Both are conditions of access: SEC_EDGAR_USER_AGENT
# lives in .env (the placeholder is refused), and the per-second rate is
# SEC_EDGAR_RATE_LIMIT_PER_SEC, defaulting to 5 — half the stated line.
edgar:
  # Not an allowance (the SEC publishes no daily cap) but a runaway-loop guard.
  # A full universe pass costs roughly 1 (ticker map) + 1 submissions call per
  # symbol + 1 document per new Form 4; 2,000 leaves room for a busy filing day
  # across ~430 symbols without letting a retry bug run unbounded.
  daily_call_budget: 2000      # [OPEN] #48
  # How far back to look for filings on a normal run. Filings are re-fetchable,
  # so this only bounds freshness work, not history.
  lookback_days: 14

# ── Insider-buying clusters (D39 / Pillar C) ────────────────────────────────
# A cluster is N or more DISTINCT insiders making OPEN-MARKET PURCHASES within
# a rolling window of D days, together worth at least some dollar amount.
#
# "Open-market purchase" means SEC transaction code 'P' and nothing else.
# Awards ('A'), option exercises ('M') and tax withholding ('F') are
# compensation events on a schedule somebody set months ago; counting them
# would build a signal that measures payroll rather than opinion. Derivative
# rows are excluded for the same reason.
#
# DISTINCT insiders, not transactions: one director filing four purchases in a
# week is one person's opinion reported four times, and counting it as four
# would make a single buyer look like a consensus.
insider_cluster:
  # D39 states the rule and fixes none of the numbers.
  min_distinct_insiders: 3     # [OPEN] #45
  window_days: 90              # [OPEN] #46
  min_aggregate_usd: 250000    # [OPEN] #47
  # Locked by the decision, not open: the code filter IS the definition.
  purchase_code: P
  exclude_derivatives: true

# ── FMP call budgeting (D29) ────────────────────────────────────────────────
# Free-tier operation. The staleness filter in fundamentals trickles the crawl
# so a day's spend stays inside the plan. Raise this on upgrade.
fmp:
  # PREMIUM, from 2026-10-21. Was 250 under the free tier (D29).
  #
  # Sized so a COLD START completes in one day, measured rather than guessed:
  #
  #   universe        527   2 constituents + 6 batch quotes + 519 daily bars
  #   estimates     1,039   1 probe + 519 x 2 period types
  #   fundamentals  5,190   519 x 5 statements x 2 period types
  #   events            3
  #                 -----
  #   full day      6,759   ~11 minutes of wall clock at 600 calls/min
  #
  # 9,000 leaves ~30% headroom for retries and a growing universe. Steady state
  # is far cheaper: the fundamentals crawl is staleness-driven, so most days it
  # touches a handful of symbols rather than all 519.
  #
  # The budget machinery stays even though Premium's limit is per-minute rather
  # than per-day: its job is no longer "stay inside the free allowance" but
  # "stop a runaway loop before it makes 200,000 calls". A bug that retries
  # forever is cheaper to catch here than on the invoice.
  #
  # Raised 9,000 -> 12,000 on 2026-10-21 for O7's one-time deep history
  # backfill: corporate actions (2 calls/symbol, ~866) + five years of bars
  # (1/symbol, ~434) + the earnings calendar in 90-day windows (~21) is ~1,321
  # calls that can land on a day the cold start already spent 8,997. A bounded
  # one-off is not what the guard is for, and at 12,000 it still catches a
  # runaway loop within minutes.
  daily_call_budget: 12000     # [OPEN] #31
  # Calls held back from the general pool for the market-wide calendars. NOT an
  # [OPEN] guess: it is exactly the number of calendar endpoints the events job
  # calls (earnings, dividends, splits), and a named test asserts it stays in
  # step with the client. The event radar is what keeps the engine from opening
  # a position blind to earnings (D19/Pillar C), so it must never be crowded out
  # by a fundamentals crawl that ran earlier in the evening.
  reserve_for_events: 3
