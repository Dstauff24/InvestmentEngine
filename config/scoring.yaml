# ============================================================================
# config/scoring.yaml — the 4-pillar confluence model (D2) and its gates (D12)
# ----------------------------------------------------------------------------
# D25: config is the only home for numbers. Every value is annotated with the
# decision it comes from.
#
# Values tagged  [OPEN]  are NOT fixed by a decision: the log states the rule
# but never set the number. Each has a row in docs/open-parameters.md and a
# provisional default approved Sep 1, 2026. A sync test keeps the tag count and
# that document in agreement.
#
# Loaded and validated by core/config.py. Unknown keys are a hard error, so a
# typo like `techncial:` fails at startup rather than silently scoring 0.
# ============================================================================

version: 1

# ── Pillar weights (D32, superseding D2) ────────────────────────────────────
# Technical 40 / Fundamental 30 / Catalyst 20 / Sentiment 10. Must total 100.
#
# D32 demoted Sentiment from 20: free-tier news is the thinnest input the engine
# has, and a pillar fed noise adds noise to every composite it touches.
# Fundamental took the weight in anticipation of the estimate-revision signal.
# That signal went LIVE on 2026-10-21 with the Premium upgrade — but the series
# starts at zero depth, so for the next several weeks this pillar carries its
# heaviest weight on its shallowest input. First thing to re-examine at the
# quarterly review (D13) if Fundamental underperforms.
#
# Demoting is not disabling. `composite.conflict_below` vetoes Tier A when ANY
# pillar scores below it, so strongly negative sentiment still caps an idea at
# `capped_at` no matter how little weight it carries. A demoted pillar can veto.
#
# D13: these get re-weighted from Shadow Book evidence at quarterly review —
# which is only possible because they live here and not in scoring/composite.py.
pillar_weights:
  technical: 40
  fundamental: 30
  catalyst: 20
  sentiment: 10

# ── Composite scale (D2) ────────────────────────────────────────────────────
composite:
  scale_min: 0
  scale_max: 100
  # A pillar scoring at or below `conflict_below` actively argues against the
  # idea; when one is present the composite cannot exceed `capped_at`.
  conflict_below: 30          # [OPEN] #2
  # One point under the Tier A gate, so a conflicted idea can never reach
  # Tier A but stays eligible for Tier B. The loader rejects >= 70.
  capped_at: 69               # [OPEN] #3

# ── What "a pillar agrees" means (D2/D12) ───────────────────────────────────
pillar_agreement:
  # The most load-bearing number in the repo. D2 and D12 both count agreeing
  # pillars and neither defines "agree", yet this single value moves Tier A/B
  # membership more than any pillar weight. First sensitivity sweep after O7.
  min_score: 60                        # [OPEN] #1
  # A pillar with no usable data (sentiment before Phase 2 wires up news) counts
  # as neither agreeing nor conflicting: it is excluded and the remaining
  # weights are renormalised.
  treat_missing_as_agreement: false

# ── Tier gates (D12) ────────────────────────────────────────────────────────
# Tier A = full confluence. Tier B = conviction/asymmetric, surfaced anyway but
# clearly labelled and sized down (config/risk.yaml).
tiers:
  a:
    min_pillars_agreeing: 3   # D12
    min_composite: 70         # D12
    min_risk_reward: 2.0      # D17
  b:
    min_pillars_agreeing: 2   # D12
    min_composite: 55         # D12
    # EXCLUSIVE upper bound: at 70 an idea is a Tier A candidate. D12's written
    # band of "55-69" is this, read as integers. Exclusive rather than 69 so
    # there is no dead zone between the tiers for a fractional composite.
    max_composite: 70         # D12
    min_risk_reward: 3.0      # D17 — Tier B must pay more to justify the odds

# D1 / edge-source #1: the engine can say "nothing today". Below this, silence.
min_surfaceable_composite: 55

# ── Cross-sectional ranking (D33) ───────────────────────────────────────────
# An absolute score decides nothing: a composite of 72 means one thing when it
# is the best in the universe and another when forty names beat it. Ideas are
# ranked by composite PERCENTILE within the universe each day, and the digest
# surfaces at most `max_ideas_per_day` by rank.
#
# Ranking selects AMONG ideas that already passed their D12 tier gate. It never
# promotes an idea that failed one — the absolute gates apply first.
ranking:
  rank_within_universe: true   # D33
  # How many ideas the daily digest may surface, highest rank first. D33 states
  # the rule and gives no number; 5 is a reading limit, not a market fact.
  max_ideas_per_day: 5         # [OPEN] #32

# ── Sentiment reinstatement (D32) ───────────────────────────────────────────
# The condition under which Sentiment earns its weight back, recorded so it is
# a test rather than a mood. Nothing reads this until the Shadow Book exists.
sentiment_reinstatement:
  min_sentiment_score: 60       # D32 — "ideas where sentiment scored 60+"
  # Closed Shadow Book ideas required before the question may even be asked.
  # D32 says "30 or more"; the floor itself is a judgement about sample size.
  min_sample: 30                # [OPEN] #37
  restore_toward: 20            # D32 — back to the pre-demotion weight

# ── Feature -> pillar-score mapping (step 5) ────────────────────────────────
# Each pillar score is 0-100. Each sub-signal maps its feature value onto that
# scale, and the pillar is the MEAN of the sub-signals that scored.
#
# EQUAL WEIGHTING WITHIN A PILLAR IS A DELIBERATE DECISION, not an oversight
# and not a missing parameter. D2/D32 fix the weights BETWEEN pillars because
# the decision log says what they are; nothing says whether revision momentum
# should outrank margin trend inside Pillar B, and inventing a number would be
# false precision dressed as configuration. D13's quarterly review introduces
# sub-weights when there is evidence to set them. Until then a sub-signal's
# influence is controlled by whether it scores at all, and abstention
# renormalizes one level down exactly as D41 does one level up.
#
# What IS parameterised: the SCALE of each signed signal — the value that earns
# full credit. A signed signal `x` maps as:
#
#     score = 50 + 50 * clamp(x / full_credit, -1, +1)
#
# so 0 is neutral (50), +full_credit is 100 and -full_credit is 0. One number
# per signal, every one a judgment call, every one an [OPEN] row.
mapping:
  # Minimum pillars that must score for a composite to exist at all (D41).
  # Technical is required separately and unconditionally.
  min_scored_pillars: 2        # [OPEN] #52

  technical:
    # Relative strength vs sector, in percentage points over the window (D33).
    # 15pp of quarterly outperformance is a strong leader; beyond that the
    # signal saturates rather than growing without limit.
    rs_full_credit_pct: 15.0   # [OPEN] #53
    # RSI "healthy" band. Inside it scores 100, and the score falls off
    # linearly to 0 at the extremes (0 and 100). NOT a recipe trigger — recipe
    # 1's 40-50 reset band is separate and lives under `recipes`.
    rsi_healthy_low: 45.0      # [OPEN] #54
    rsi_healthy_high: 70.0     # [OPEN] #55

  fundamental:
    # YoY growth earning full credit, in percent.
    growth_full_credit_pct: 25.0      # [OPEN] #56
    # Change in the growth RATE, in percentage points.
    acceleration_full_credit_pp: 10.0 # [OPEN] #57
    # Margin expansion earning full credit, in percentage points.
    margin_trend_full_credit_pp: 2.0  # [OPEN] #58
    # Consensus EPS revision earning full credit, in percent.
    revision_full_credit_pct: 5.0     # [OPEN] #59
    # Revision momentum abstains below this much of OUR OWN series (D41 +
    # features/evidence.py). Correct at 2 snapshots, trustworthy at 60 — this
    # is where "trustworthy enough to score" is drawn.
    revision_min_observations: 4      # [OPEN] #60

  catalyst:
    # Earnings within this many days is a live catalyst, scoring 100 and
    # falling off linearly to 50 at the horizon.
    earnings_near_days: 10            # [OPEN] #61
    earnings_horizon_days: 45         # [OPEN] #62
    # Post-earnings drift window (recipe 3's territory): days SINCE earnings
    # that still count as a catalyst.
    drift_window_days: 30             # [OPEN] #63
    # An ex-dividend date inside this many days is a RISK, not a catalyst
    # (D19(3) forbids a new swing long within 2 days) — it subtracts.
    ex_div_penalty_days: 3            # [OPEN] #64

  sentiment:
    # Tone delta earning full credit, on the -1..+1 scorer scale.
    tone_delta_full_credit: 0.25      # [OPEN] #65
    # Volume spike earning full credit, as a ratio over normal flow.
    volume_spike_full_credit: 3.0     # [OPEN] #66

# ── Sentiment (Pillar D, D32) ───────────────────────────────────────────────
# SENTIMENT MEASURES CHANGE, NOT LEVEL. A stock whose coverage is permanently
# gloomy is not a sell signal every day; a stock whose coverage just turned is
# information. So the readings are a tone DELTA — trailing window against a
# longer baseline — and a news-VOLUME spike against the symbol's own normal
# flow. Absolute tone feeds those; it is not a signal on its own.
#
# Per-symbol normalisation matters as much as the delta: a biotech with two
# articles a week and a mega-cap with forty have different "normal", and a raw
# article count would make the mega-cap look permanently newsworthy.
sentiment:
  # Trailing window: what just happened.
  trailing_days: 7             # [OPEN] #50
  # Baseline it is compared against. Must exceed the trailing window, or the
  # comparison is a window against itself.
  baseline_days: 30            # [OPEN] #51
  # ABSTENTION FLOOR. Below this many articles in the trailing window the
  # reading is None rather than a confident delta computed from almost
  # nothing. Three articles can disagree wildly and average to anything.
  min_articles: 5              # [OPEN] #49
  # Phase 1 scorer. The Claude API scorer arrives in Phase 2 and every reading
  # records which one produced it, so calibration never mixes them (D39).
  scorer: lexicon

# ── Strategy promotion ladder (D40) ─────────────────────────────────────────
# What the engine is ALLOWED to do with a recipe's ideas:
#
#   shadow  surfaced and tracked, FLAGGED NOT ACTIONABLE
#   paper   additionally sized against a virtual account with the full
#           D17/D18 risk stack, tracked as simulated positions
#   live    the human trades them
#
# New strategies always enter `shadow` — including one that backtests well,
# because a backtest is only uncontaminated evidence if nobody looked at it
# first, and somebody always did.
#
# Promotion and demotion are RULES, not conversations: that is why the
# thresholds live here. The quarterly review (D13) is where they are acted on.
# `shadow_book.status_at_call` stamps every idea, because expectancy measured
# across a boundary averages two different strategies.
promotion:
  # Per-recipe status. One line each, so a promotion is a reviewable diff.
  status:
    pullback_to_trend: shadow     # D40 — nothing has 30 closed ideas yet
    base_breakout: shadow         # D40
    post_earnings_drift: shadow   # D40

  shadow_to_paper:
    # D39(2)/D40 fix 30; the expectancy floor is a judgement.
    min_closed_ideas: 30                 # D40
    min_expectancy_r: 0.10               # [OPEN] #38

  paper_to_live:
    min_closed_ideas: 30                 # D40 — the same floor applies again
    # "Sustained" and "within tolerance" are the words D40 leaves open.
    sustained_window_days: 90            # [OPEN] #39
    min_expectancy_r: 0.20               # [OPEN] #40
    # D39(1): of ideas scored 70-80, what fraction reached TP1? The gap between
    # predicted and realised hit rate, in percentage points.
    max_calibration_error_pct: 15.0      # [OPEN] #41

  demotion:
    # Automatic, so a strategy that stops working stops being actionable
    # without anyone having to admit anything.
    window_days: 60                      # [OPEN] #42
    min_closed_ideas: 20                 # [OPEN] #43
    expectancy_r_below: 0.0              # [OPEN] #44

# ── Trade-plan geometry (D11/D12) ───────────────────────────────────────────
# Where the stop and targets go, given the structure `features/technical.py`
# measured. NOT previously in config despite D25 requiring it: the trim
# fractions and the move-stop-to-breakeven rule were in risk.yaml, but the stop
# DISTANCE and the target levels were nowhere, so the first recipe would have
# hard-coded them.
#
# TARGETS COME FROM STRUCTURE, NOT FROM R MULTIPLES, and that is the important
# choice. Setting TP2 at "3R" would make R:R a CONSTANT, and D12's "Tier A
# needs R:R >= 2, Tier B >= 3" would then be satisfied by construction on every
# single idea — a gate that can never bind. Hanging targets on levels the market
# actually made means R:R varies per idea and the gate does real work.
geometry:
  # ATR multiple subtracted below the structural stop level, so ordinary noise
  # does not take the trade out at the exact level everyone else sees.
  stop_atr_buffer: 0.5        # [OPEN] #68
  # Half-width of the entry zone, in ATR. An entry "zone" rather than a price
  # because a limit at one number either fills or watches the trade leave.
  entry_zone_atr: 0.3         # [OPEN] #69
  # A stop closer than this to the entry is rejected: it is inside the noise,
  # and the resulting R:R would be flattering nonsense.
  min_stop_atr: 0.5           # [OPEN] #70

  pullback_to_trend:
    # Window for the prior swing high a pullback is expected to reclaim (TP1).
    swing_lookback_days: 60   # [OPEN] #71
    # TP2 as a multiple of the TP1 distance — the measured move beyond the
    # reclaim. A multiple of a STRUCTURAL distance, not of risk.
    tp2_measured_move: 1.6    # [OPEN] #72

  base_breakout:
    # TP1 = entry + base depth (the classic measured move). TP2 extends it.
    tp1_depth_multiple: 1.0   # [OPEN] #73
    tp2_depth_multiple: 1.8   # [OPEN] #74

  post_earnings_drift:
    # Targets measured from the gap size, which is the market's own statement
    # about how much the news was worth.
    tp1_gap_multiple: 1.0     # [OPEN] #75
    tp2_gap_multiple: 2.0     # [OPEN] #76

# ── Phase 1 recipes ─────────────────────────────────────────────────────────
# Parameters for the three setups in the decision log, in implementation order.
# Nothing here is scoring logic — these are the inputs that logic will read.
recipes:
  pullback_to_trend:
    enabled: true
    ma_fast: 20                        # recipe 1: uptrend 20 > 50 > 200
    ma_mid: 50
    ma_slow: 200
    require_ma_stack: true
    pullback_to: [20, 50]              # pullback to a rising fast or mid MA
    require_ma_rising: true
    rsi_period: 14                     # [OPEN] #4 — standard Wilder default
    rsi_min: 40                        # recipe 1: RSI reset 40-50
    rsi_max: 50
    volume_dryup_ratio: 0.8            # [OPEN] #5 — pullback vol vs 20d average
    require_reversal_candle: true
    no_earnings_within_days: 5         # recipe 1
    horizon_days: [2, 15]              # framework swing horizon

  base_breakout:
    # DORMANT, by decision rather than by accident (O13). `base_contraction` is
    # measured as the ratio of mean daily range over the last fifth of the base
    # to that of the whole base — a statistic centred on 1.00 by construction
    # (measured: p10 0.81, median 1.00, p90 1.23 over 8,236 observations), so
    # the 0.6 gate below asks for something that barely occurs and no legal
    # value admits a usable population. Switched off so the logs say "disabled"
    # instead of "fired zero times", which look identical and are not the same
    # fact. Re-enable only after `_detect_base` is redesigned and re-swept.
    enabled: false
    min_base_weeks: 4                  # [OPEN] #6 — "multi-week base" undefined
    max_base_depth_pct: 25             # [OPEN] #7
    range_contraction_ratio: 0.6       # [OPEN] #8 — recent ATR vs base-period ATR
    require_relative_strength_vs_sector: true
    min_relative_volume_on_break: 1.5  # recipe 2: rel-volume >= 1.5x
    breakout_buffer_pct: 0.5           # [OPEN] #9
    horizon_days: [5, 30]              # [OPEN] #10

  post_earnings_drift:
    enabled: true
    require_eps_beat: true             # recipe 3
    require_revenue_beat: true
    # O12. `growth_proxy` is what the recipe has always done — year-over-year
    # EPS growth standing in for a beat, because the stored earnings rows
    # carried no actuals until D47 moved the radar to the per-symbol endpoint.
    # `verified` compares the reported actual to the consensus estimate, which
    # is what a beat IS: a company can grow 20% year on year and still miss.
    # Both are backtested side by side before this moves (no number here, so no
    # [OPEN] tag — a named test pins it instead).
    beat_source: growth_proxy
    require_raised_guidance: true
    # D46: adopted at the D43 sweep's measured p75. The shipped 2.0% gave 96
    # signals at +0.16R; 0.57% gives 231 at +0.26R on 227 closed — more trades
    # AND better ones, which says a very large gap is exhaustion rather than
    # information. Still [OPEN]: it is a percentile of a 60-symbol, 3-year
    # distribution, not a number a decision fixes, and D39 governs it from here
    # on real outcomes.
    min_gap_up_pct: 0.57               # [OPEN] #11
    require_holds_day_one_low: true
    # Adjusted 5 -> 10 on Sep 1: day-1-low confirmation takes sessions, and
    # the day-5-to-8 gap retest is the cleanest entry.
    max_days_since_earnings: 10        # [OPEN] #12
    horizon_days: [5, 45]              # [OPEN] #13 — drift runs for weeks
